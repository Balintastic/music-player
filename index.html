<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/bf06bcadea.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <div class="music-player">
            <div class="image-section">
                <img src="assets/song-image.jpg" alt="song image">
            </div>
            <div class="controls">
                <h2>Song</h2>
                <div class="info">
                    <p>Music Producer</p>
                    <p></p>
                </div>
                <input type="range">
                <div class="playback-controls">
                    <button class="playback-previous"><i class="fa-solid fa-backward-step fa-2x"></i></button>
                    <button class="playback-play-pause"><i class="fa-solid fa-play fa-3x"></i></button>
                    <button class="playback-next"><i class="fa-solid fa-forward-step fa-2x"></i></button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
